{% extends "base.html" %}

{% block title %}
Edit Profile
{% endblock %}

{% block navbar %}
{% include "staff_navbar.html" %}
{% endblock %}

{% block content %}

<div class="container mt-4">

    <h2 class="text-success mb-4">
        Edit Profile
    </h2>

    <div class="card shadow border-0">
        <div class="card-body">

            <form method="POST">

                <div class="mb-3">
                    <label class="form-label">Name</label>
                    <input type="text" class="form-control" name="name" value="{{ staff.name }}" required>
                </div>

                <div class="mb-3">
                    <label class="form-label">Email</label>
                    <input type="email" class="form-control" value="{{ staff.email }}" readonly>
                </div>

                <div class="mb-3">
                    <label class="form-label">Age</label>
                    <input type="number" class="form-control" name="age" value="{{ staff.age }}" required>
                </div>

                <div class="mb-3">
                    <label class="form-label">Gender</label>
                    <select class="form-select" name="gender">

                        <option value="Male"
                        {% if staff.gender=="Male" %}selected{% endif %}>
                            Male
                        </option>

                        <option value="Female"
                        {% if staff.gender=="Female" %}selected{% endif %}>
                            Female
                        </option>

                        <option value="Other"
                        {% if staff.gender=="Other" %}selected{% endif %}>
                            Other
                        </option>

                    </select>
                </div>

                <div class="mb-3">
                    <label class="form-label">Contact</label>
                    <input type="text" class="form-control" name="contact" value="{{ staff.contact }}" required>
                </div>

                <div class="mb-3">
                    <label class="form-label">Experience (Years)</label>
                    <input type="number" class="form-control" name="experience" value="{{ staff.experience }}" required>
                </div>

                <div class="mb-4">
                    <label class="form-label">New Password</label>
                    <input type="password" class="form-control" name="password"
                    placeholder="Leave blank to keep current password">
                </div>

                <button type="submit" class="btn btn-success">
                    Update Profile
                </button>

            </form>

        </div>
    </div>

</div>

{% endblock %}
