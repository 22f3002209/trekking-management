{% extends "base.html" %}

{% block title %}
Edit Trek
{% endblock %}

{% block navbar %}
{% include "admin_navbar.html" %}
{% endblock %}

{% block content %}

<div class="row justify-content-center mt-4">
    <div class="col-md-7">

        <div class="card shadow border-0 p-4">

            <h2 class="text-success text-center mb-4">
                Edit Trek
            </h2>

            <form method="POST">

                <div class="mb-3">
                    <label class="form-label">Trek Name</label>
                    <input type="text" class="form-control" name="name" value="{{ trek.name }}" required>
                </div>

                <div class="mb-3">
                    <label class="form-label">Location</label>
                    <input type="text" class="form-control" name="location" value="{{ trek.location }}" required>
                </div>

                <div class="row">

                    <div class="col-md-6 mb-3">
                        <label class="form-label">Difficulty</label>

                        <select class="form-select"name="difficulty">
                            <option {% if trek.difficulty=='Easy' %}selected{% endif %}>Easy</option>
                            <option {% if trek.difficulty=='Moderate' %}selected{% endif %}>Moderate</option>
                            <option {% if trek.difficulty=='Hard' %}selected{% endif %}>Hard</option>
                        </select>
                    </div>

                    <div class="col-md-6 mb-3">
                        <label class="form-label">Duration</label>
                        <input type="number" class="form-control" name="duration" value="{{ trek.duration }}">
                    </div>

                </div>

                <div class="mb-3">
                    <label class="form-label">Total Slots</label>
                    <input type="number" class="form-control" name="total_slots" value="{{ trek.total_slots }}">
                </div>

                <div class="mb-3">
                    <label class="form-label">Description</label>
                    <textarea class="form-control" rows="4" name="description">{{ trek.description }}</textarea>
                </div>

                <div class="row">

                    <div class="col-md-6 mb-3">
                        <label class="form-label">Start Date</label>
                        <input type="date" class="form-control" name="start_date" value="{{ trek.start_date }}">
                    </div>

                    <div class="col-md-6 mb-3">
                        <label class="form-label">End Date</label>
                        <input type="date" class="form-control" name="end_date" value="{{ trek.end_date }}">
                    </div>

                </div>

                <div class="mb-3">
                    <label class="form-label">Assigned Staff</label>

                    <select class="form-select" name="assigned_staff_id">
                        {% for staff in approved_staff %}

                        <option value="{{ staff.id }}"
                            {% if trek.assigned_staff_id == staff.id %}selected{% endif %}>
                            {{ staff.name }}
                        </option>

                        {% endfor %}
                    </select>
                </div>

                <div class="mb-3">
                    <label class="form-label">Status</label>
                    
                    <select class="form-select" name="status">
                        <option {% if trek.status=='Pending' %}selected{% endif %}>Pending</option>
                        <option {% if trek.status=='Approved' %}selected{% endif %}>Approved</option>
                        <option {% if trek.status=='Open' %}selected{% endif %}>Open</option>
                        <option {% if trek.status=='Closed' %}selected{% endif %}>Closed</option>
                        <option {% if trek.status=='Completed' %}selected{% endif %}>Completed</option>
                    </select>
                </div>

                <div class="d-flex justify-content-between">
                    <a href="{{ url_for('routes.manage_treks') }}"
                    class="btn btn-outline-secondary">
                        Back
                    </a>

                    <button type="submit" class="btn btn-success">
                        Update Trek
                    </button>
                </div>

            </form>

        </div>

    </div>
</div>

{% endblock %}
