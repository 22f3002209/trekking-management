{% extends "base.html" %}

{% block Title %}
Trekker Login
{% endblock %}

{% block navbar %}
<nav class="navbar navbar-expand-lg navbar-light bg-white shadow-sm">

    <div class="container">

        <a class="navbar-brand fw-bold text-success"
        href="{{ url_for('routes.home') }}">
        🏔️ Trekmate
        </a>

        <button class="navbar-toggler"
                data-bs-toggle="collapse"
                data-bs-target="#navbarContent">
            <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse" id="navbarContent">

            <ul class="navbar-nav ms-auto">

                <li class="nav-item">
                    <a class="nav-link" href="{{ url_for('auth.admin_login') }}">
                    Admin
                    </a>
                </li>

                <li class="nav-item">
                    <a class="nav-link" href="{{ url_for('auth.staff_register') }}">
                        Staff Register
                    </a>
                </li>

                <li class="nav-item">
                    <a class="nav-link" href="{{ url_for('auth.staff_login') }}">
                        Staff
                    </a>
                </li>

                <li class="nav-item">
                    <a class="nav-link" href="{{ url_for('auth.trekker_register') }}">
                        Register
                    </a>
                </li>

                <li class="nav-item">
                    <a class="btn btn-success ms-2" href="{{ url_for('auth.trekker_login') }}">
                        Trekker Login
                    </a>
                </li>

            </ul>

        </div>
        
    </div>

</nav>
{% endblock %}

{% block content %}

<div class="row justify-content-center mt-5">
    <div class="col-md-5">
        <div class="card shadow border-0 p-4">
            
            <div class="text-center mb-4">                
                <h1>🥾</h1>
                <h2 class="text-success">Trekker Login</h2>
                <p class="text-muted">
                    Continue your Adventure
                </p>
            </div>

            <form method="POST">

                <div class="mb-3"> 
                    <label class="form-label"> Email Address </label>
                    <input type="email" class="form-control" name="email" required>
                </div>

                <div class="mb-3">      
                    <label class="form-label"> Password </label>
                    <input type="password" class="form-control" name="password" required>
                </div>

                <button type="submit" class="btn btn-success w-100"> Login </button>

            </form>

        </div>
    </div>

</div>

{% endblock %}
